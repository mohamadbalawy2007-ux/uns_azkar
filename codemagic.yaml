workflows:
  ios-unsigned:
    name: iOS Unsigned Build
    max_build_duration: 60
    environment:
      flutter: stable
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Build unsigned iOS
        script: flutter build ios --release --no-codesign
      - name: Add Arabic app name
        script: |
          APP_PATH="build/ios/iphoneos/Runner.app"
          mkdir -p "$APP_PATH/ar.lproj"
          cp ios/Runner/ar.lproj/InfoPlist.strings "$APP_PATH/ar.lproj/InfoPlist.strings"
          plutil -convert binary1 "$APP_PATH/ar.lproj/InfoPlist.strings" || true
      - name: Create IPA manually
        script: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r unsigned.ipa Payload
    artifacts:
      - build/ios/iphoneos/unsigned.ipa
